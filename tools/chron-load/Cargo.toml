[package]
name = "chron-load"
description = "chron: a load generator that checks the database's invariants while it runs"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "chron-load"
path = "src/main.rs"

[dependencies]
chron = { workspace = true, features = ["tokio"] }
chron-client = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
tonic = { workspace = true }

[dev-dependencies]
chrond = { workspace = true, features = ["test-util"] }
