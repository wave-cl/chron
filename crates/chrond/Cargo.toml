[package]
name = "chrond"
description = "chron: the gRPC daemon serving one database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/chrond"
keywords = ["event-sourcing", "event-store", "database", "grpc", "replication"]
categories = ["database-implementations", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "chrond"
path = "src/bin/chrond.rs"

[dependencies]
chron = { workspace = true, features = ["tokio"] }
chron-proto = { workspace = true, features = ["convert"] }
chron-client = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
pin-project-lite = { workspace = true }
prometheus = { workspace = true }
subtle = { workspace = true }
http = { workspace = true }
rcgen = { workspace = true, optional = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
uuid = { workspace = true }

[features]
# Certificate generation for tests: `chrond::testing`.
test-util = ["dep:rcgen"]

[dev-dependencies]
tempfile = { workspace = true }
rcgen = { workspace = true }
chron = { workspace = true, features = ["tokio"] }
uuid = { workspace = true, features = ["v4"] }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
