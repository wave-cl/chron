[package]
name = "chron"
description = "Embeddable event-sourcing log: append-only segments + redb indexes, multi-aggregate atomic transactions, tags"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Async head notifications: `Db::wait_for_async`, `Subscription::next_async`.
tokio = ["dep:tokio"]

[dependencies]
redb = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
crc32fast = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
crc32fast = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
criterion = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "suite"
path = "tests/suite/main.rs"

[[bench]]
name = "chron"
harness = false
