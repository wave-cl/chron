[package]
name = "chron-cli"
description = "chron: the command-line client and offline maintenance tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["event-sourcing", "event-store", "cli", "grpc"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "chron"
path = "src/main.rs"
# The binary shares the library's name; only the library is documented.
doc = false

[dependencies]
chron = { workspace = true }
chron-client = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-stream = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chrond = { workspace = true, features = ["test-util"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
