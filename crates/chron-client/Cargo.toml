[package]
name = "chron-client"
description = "chron: a typed async client for chrond over gRPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/chron-client"
keywords = ["event-sourcing", "event-store", "grpc", "client", "async"]
categories = ["database", "asynchronous"]

[dependencies]
chron = { workspace = true }
chron-proto = { workspace = true, features = ["convert"] }
bytes = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["tls-native-roots"] }
tonic-health = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# A path-only dev-dependency (no version): cargo strips it from the
# published manifest, which breaks the chrond -> chron-client -> chrond
# cycle that a workspace publish could not order otherwise.
chrond = { path = "../chrond", features = ["test-util"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[test]]
name = "suite"
path = "tests/suite/main.rs"
