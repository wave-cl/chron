syntax = "proto3";

package chron.v1;

// An event as recorded. `aggregate` is 16 bytes; absent for a free event
// (one appended to no aggregate), whose `index` is then 0.
message Event {
  uint64 position = 1;
  optional bytes aggregate = 2;
  uint64 index = 3;
  int64 recorded_at_unix_nanos = 4;
  bool first_in_txn = 5;
  bool last_in_txn = 6;
  repeated bytes tags = 7;
  bytes metadata = 8;
  bytes payload = 9;
  // The 16-byte commit id the writer gave the transaction, on its first
  // event only.
  optional bytes commit_id = 10;
}

message NewEvent {
  repeated bytes tags = 1;
  bytes metadata = 2;
  bytes payload = 3;
}

// What an append asserts about the aggregate's length. Unset means `any`.
message Expected {
  message Any {}
  message New {}
  oneof kind {
    Any any = 1;
    New new = 2;
    uint64 exact = 3;
  }
}

// One append of a transaction. `aggregate` absent: free events, for which
// `expected` must be unset or `any`.
message Append {
  optional bytes aggregate = 1;
  Expected expected = 2;
  repeated NewEvent events = 3;
}

message CommitRequest {
  repeated Append appends = 1;
  // Fencing token: the epoch the writer last saw in Info. Absent: no
  // check. Stale, or newer than the daemon's epoch, is FAILED_PRECONDITION
  // with the metadata `chron-epoch` carrying the daemon's epoch; without
  // peers a newer one also fences the daemon.
  optional uint64 epoch = 2;
  // Absent: the daemon's --sync-commit. true: acknowledge only once a
  // majority of the group durably holds the transaction; false: once it
  // is on this node's disk. Ignored without peers. A transaction that
  // landed locally but was not confirmed by a majority within the sync
  // timeout, or before the node stopped leading, is DEADLINE_EXCEEDED
  // with the metadata `chron-committed-first` and `chron-committed-next`:
  // it is on this node's disk and replicates unless the node dies. Resend
  // it with the same commit_id, or check before resending it without one.
  optional bool sync = 3;
  // Sixteen bytes chosen by the writer, or empty. A later commit with the
  // same id and the same events' aggregates is answered with the first
  // one's positions and `duplicate = true`, nothing written, whatever its
  // expectations and payloads; the same id on another shape is
  // INVALID_ARGUMENT. Stored in the transaction's first record (a 0.4.0
  // daemon cannot read it). Ids of transactions dropped by retention or
  // truncation are forgotten.
  bytes commit_id = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_LEADER = 1;
  ROLE_REPLICA = 2;
  ROLE_FENCED = 3;
  // With peers: no leader is known and this node holds no lease; writes
  // are refused until a leader is elected or heard.
  ROLE_CANDIDATE = 4;
  // With peers: this node is not in the group's membership (removed, or
  // not yet added). It serves reads, follows the leader it hears without
  // voting or counting, never campaigns, and refuses writes.
  ROLE_REMOVED = 5;
}

message AppendResult {
  optional bytes aggregate = 1;
  uint64 first_position = 2;
  uint64 first_index = 3;
  uint64 count = 4;
  uint64 new_len = 5;
}

// Positions of the transaction's first and last event, the head after it,
// and one result per append.
message CommitResponse {
  uint64 first = 1;
  uint64 last = 2;
  uint64 next = 3;
  repeated AppendResult appends = 4;
  // The commit_id was seen before: these are the positions of the earlier
  // landing and nothing was written now.
  bool duplicate = 5;
}

// What a read, head or subscription may see. LOCAL: everything this
// node holds. CONFIRMED: only positions a majority of the failover
// group durably holds, so nothing a leader's death can erase; the same
// as LOCAL on a node without peers or with sync commits off.
// UNSPECIFIED: the daemon's default (--read-consistency; confirmed when
// sync commits are in effect).
enum Consistency {
  CONSISTENCY_UNSPECIFIED = 0;
  CONSISTENCY_LOCAL = 1;
  CONSISTENCY_CONFIRMED = 2;
}

// For every finite read, `limit` 0 means "to the end". Forward, `from` is
// the first index or position returned; backward, the inclusive upper
// bound, newest first, and the maximum uint64 means "from the end".
// `at_least` makes the call wait until the bound under `consistency`
// reaches that position (read your writes: a commit's `next`), at most
// `wait_timeout_ms` (absent: the daemon's --sync-timeout; 0: do not
// wait); past it the answer is DEADLINE_EXCEEDED with the bound in the
// `chron-position` header and the head in `chron-head`.
message ReadAggregateRequest {
  bytes aggregate = 1;
  uint64 from_index = 2;
  uint64 limit = 3;
  bool backward = 4;
  Consistency consistency = 5;
  optional uint64 at_least = 6;
  optional uint64 wait_timeout_ms = 7;
}

message ReadAllRequest {
  uint64 from = 1;
  uint64 limit = 2;
  bool backward = 3;
  Consistency consistency = 4;
  optional uint64 at_least = 5;
  optional uint64 wait_timeout_ms = 6;
}

message ReadTagRequest {
  bytes tag = 1;
  uint64 from = 2;
  uint64 limit = 3;
  bool backward = 4;
  Consistency consistency = 5;
  optional uint64 at_least = 6;
  optional uint64 wait_timeout_ms = 7;
}

// The aggregate's length under `consistency` (see Consistency): under
// CONFIRMED, its events below the confirmed bound; `at_least` waits for
// the bound first.
message AggregateLenRequest {
  bytes aggregate = 1;
  Consistency consistency = 2;
  optional uint64 at_least = 3;
  optional uint64 wait_timeout_ms = 4;
}
message AggregateLenResponse { uint64 len = 1; }

// `head` answers the bound under the effective consistency; `confirmed`
// and `local` are both bounds whatever was asked.
message HeadRequest {
  Consistency consistency = 1;
  optional uint64 at_least = 2;
  optional uint64 wait_timeout_ms = 3;
}
message HeadResponse {
  uint64 head = 1;
  uint64 confirmed = 2;
  uint64 local = 3;
}

// Events from `from` (which may be past the head: the stream then waits
// for it), then live ones as they are committed. With `tag`, only events
// carrying it. Never ends on its own. Under CONFIRMED an event is
// delivered once a majority holds it.
message SubscribeRequest {
  uint64 from = 1;
  optional bytes tag = 2;
  Consistency consistency = 3;
  // A durable cursor: the daemon keeps the subscription's position
  // under this name (see Ack). The stream starts at the cursor's stored
  // next (at `from` when the cursor is new; at the floor when below
  // it), delivers confirmed events only, and takes over from any
  // earlier stream on the cursor, which ends UNAVAILABLE. The response
  // metadata carries `chron-session` (this stream's session) and
  // `chron-cursor-from` (where it starts). Leader only.
  string cursor = 4;
}

// What the daemon keeps per cursor: `next` is the position after the
// last acknowledged event, `session` the live subscription's (a new
// one takes `session + 1`); `deleted` marks a removal on the
// replication stream.
message CursorState {
  string name = 1;
  uint64 next = 2;
  uint64 session = 3;
  bool deleted = 4;
}

// Acknowledges a cursor's progress: `next` is the position after the
// last event processed. Below the stored next it is a no-op (the
// stored value is answered); above the confirmed bound it is
// INVALID_ARGUMENT with the bound in `chron-position`; with a session
// other than the live one FAILED_PRECONDITION "taken over", carrying
// the live session in `chron-session`; an unknown cursor is NOT_FOUND.
// Leader only.
message AckRequest {
  string cursor = 1;
  uint64 next = 2;
  uint64 session = 3;
}
message AckResponse { uint64 next = 1; }

message ListCursorsRequest {}
message ListCursorsResponse {
  repeated CursorState cursors = 1;
  // The confirmed bound, so a cursor's lag is `confirmed - next`.
  uint64 confirmed = 2;
}

// Removes a cursor (admin); its live stream ends UNAVAILABLE.
message DeleteCursorRequest { string cursor = 1; }
message DeleteCursorResponse { bool existed = 1; }

message FlushRequest {}
message FlushResponse {}

message Options {
  uint64 segment_max_bytes = 1;
  uint64 max_record_bytes = 2;
  bool fsync = 3;
  bool verify_all_segments = 4;
}

message InfoRequest {}
message InfoResponse {
  string path = 1;
  uint64 head = 2;
  uint64 floor = 3;
  uint64 segments = 4;
  uint64 bytes = 5;
  Options options = 6;
  bytes db_id = 7;
  uint64 epoch = 8;
  Role role = 9;
  optional string replicating_from = 10;
  bool replica_connected = 11;
  optional uint64 leader_head = 12;
  optional string last_replication_error = 13;
  optional uint64 fenced_by = 14;
  // Whether commits are synced to disk before they are acknowledged.
  bool fsync = 15;
  // The database this call was addressed to (`chron-db`, or `default`).
  string database = 16;
  // The leader's address as this node knows it: its own on a leader, the
  // one it follows on a replica, the last one heard on a candidate.
  optional string leader_addr = 17;
  // On a leader with peers: how much of the majority lease is left (0
  // once it expired, when writes are refused).
  optional uint64 lease_remaining_ms = 18;
  // The peers this node was started with (empty without --peer).
  repeated string peers = 19;
  // The epoch of the vote this node last gave, if any.
  optional uint64 voted_epoch = 20;
  // On a leader with peers: the highest position a majority durably
  // holds (sync commits are acknowledged at or past it).
  optional uint64 majority_applied = 21;
  // On a leader with peers: every follower attached through Follow.
  repeated FollowerStatus followers = 22;
  // Whether the daemon acknowledges commits only once a majority holds
  // them (--sync-commit majority).
  bool sync_commit = 23;
  // The group's membership generation this node holds (see Members).
  uint64 members_version = 24;
  uint64 members_epoch = 25;
  // The confirmed bound (see Consistency) on a node with peers, and the
  // consistency reads get when they do not say.
  optional uint64 confirmed = 28;
  Consistency read_consistency = 29;
  // On a leader: whether that generation is committed (a majority of it
  // holds it and everything confirmed before it was made).
  bool members_committed = 26;
  // Whether this node is in the membership.
  bool member = 27;
}

// The failover group's membership: the full set of advertised addresses,
// stamped with the epoch of the leader that published it and a version
// that rises by one per change. Generations order by (epoch, version);
// a node holding a lower one adopts a higher one it is sent, persisting
// it first, and refuses a sender holding a lower one.
message Members {
  uint64 epoch = 1;
  uint64 version = 2;
  repeated string addrs = 3;
}

message GetMembersRequest {}

// The membership as this node holds it. Open to any token.
message GetMembersResponse {
  Members members = 1;
  // On a leader: whether the generation is committed.
  bool committed = 2;
  // Whether this node is in it.
  bool member = 3;
  optional string leader_addr = 4;
}

// Adds or removes one address, on the leader, one change at a time: the
// next generation is persisted here and pushed with the heartbeats, and
// is committed once a majority of the new membership has persisted it
// and durably holds everything this leader held when it was made. An
// added node must be following this leader unless `force`. An admin
// call. Not committed in time is not an error: GetMembers says when it
// is; a second change while one is pending is FAILED_PRECONDITION.
message ChangeMembersRequest {
  oneof change {
    string add = 1;
    string remove = 2;
  }
  bool force = 3;
}

message ChangeMembersResponse {
  Members members = 1;
  bool committed = 2;
}

// One follower as the leader sees it.
message FollowerStatus {
  string peer = 1;
  // The position it last reported applied.
  uint64 applied = 2;
  // Whether it syncs what it applies to disk.
  bool durable = 3;
  // Whether its acknowledgments count toward the majority (a configured
  // peer, at least as durable as the leader).
  bool counted = 4;
}

// The first message of Follow: like Replicate, plus who follows and how
// durably it applies.
message FollowOpen {
  uint64 from_position = 1;
  optional uint32 last_fingerprint = 2;
  // The follower's advertised address (--advertise).
  string peer_addr = 3;
  // Whether the follower fsyncs what it applies.
  bool durable = 4;
}

// The follower applied everything below `head`, durably when it said so.
message FollowApplied { uint64 head = 1; }

message FollowRequest {
  oneof msg {
    FollowOpen open = 1;
    FollowApplied applied = 2;
  }
}

// A leader with peers tells each of them, every third of the lease, that
// it leads under `epoch`. An admin call.
message HeartbeatRequest {
  uint64 epoch = 1;
  string leader_addr = 2;
  uint64 head = 3;
  uint64 lease_ttl_ms = 4;
  // The leader's membership generation; a receiver behind it adopts it
  // (persisting it before acknowledging), one ahead refuses.
  Members members = 5;
  // Per database, the highest position a majority durably holds, so a
  // follower's confirmed reads keep up when no chunk is flowing.
  repeated DatabaseHead confirmed = 6;
}

// `ok` acknowledges the lease; `epoch` is the answering node's own, so a
// leader learns of a newer one; `members` is the answering node's
// membership, so a refused leader learns what it is behind.
message HeartbeatResponse {
  bool ok = 1;
  uint64 epoch = 2;
  optional string leader_addr = 3;
  uint64 head = 4;
  Members members = 5;
}

message DatabaseHead {
  string name = 1;
  uint64 head = 2;
}

// A node asks a peer to vote for it as the leader under `epoch`.
// `last_epoch` and `databases` say how up to date the candidate is;
// `pre_vote` asks whether the vote would be granted without granting it;
// `forced` (an operator's promote) ignores a leader heard recently, and
// a leader that grants it fences itself first. An admin call.
message RequestVoteRequest {
  uint64 epoch = 1;
  string candidate_addr = 2;
  uint64 last_epoch = 3;
  repeated DatabaseHead databases = 4;
  bool forced = 5;
  bool pre_vote = 6;
  // The candidate's membership generation (see HeartbeatRequest).
  Members members = 7;
}

message RequestVoteResponse {
  bool granted = 1;
  // The answering node's own epoch.
  uint64 epoch = 2;
  // Why the vote was refused, for the log.
  string reason = 3;
  // The answering node's membership, for a candidate behind it.
  Members members = 4;
}

// The stored crc32 of the records at `positions`, so a copy of the
// database can find where its history parts from this one. An admin call.
message FingerprintsRequest { repeated uint64 positions = 1; }
message FingerprintAt {
  uint64 position = 1;
  // Absent past the head or below the floor.
  optional uint32 crc = 2;
}
message FingerprintsResponse { repeated FingerprintAt fingerprints = 1; }

// A full backup of the database as the archive's bytes, in order: what
// `chron restore` reads. Needs no --backup-dir and is served in every
// role; the database's Retain and Backup wait while it runs. An admin
// call.
message FetchBackupRequest {}
message BackupChunk { bytes data = 1; }

message DiscoverRequest {}

// Who leads, as this node knows it. Open to any token.
message DiscoverResponse {
  optional string leader_addr = 1;
  uint64 epoch = 2;
  // The membership generation this node holds (see Members).
  uint64 members_version = 6;
  uint64 members_epoch = 7;
  Role role = 3;
  repeated string peers = 4;
  optional uint64 lease_remaining_ms = 5;
}

// One of the daemon's databases.
message DatabaseInfo {
  string name = 1;
  uint64 head = 2;
  uint64 floor = 3;
  uint64 epoch = 4;
  bytes db_id = 5;
  // The options the database runs with (its own, or the daemon's).
  Options options = 6;
}

// Per-database choices at creation; what is left unset follows the
// daemon's flags. Kept with the database and mirrored by replicas.
message DatabaseOptions {
  optional bool fsync = 1;
  optional uint64 max_record_bytes = 2;
}

// A database dropped on the leader: replicas remove their copy of it
// (matched by identity, never by name, so a database recreated under
// the name is untouched). Kept 30 days.
message Tombstone {
  bytes db_id = 1;
  string name = 2;
  uint64 dropped_at_unix_secs = 3;
}

// A new, empty database named `name` (`[a-z0-9_-]{1,64}`). ALREADY_EXISTS
// when one exists; FAILED_PRECONDITION on a replica or a fenced node.
message CreateDatabaseRequest {
  string name = 1;
  DatabaseOptions options = 2;
}
message CreateDatabaseResponse { DatabaseInfo database = 1; }
message ListDatabasesRequest {}
message ListDatabasesResponse {
  repeated DatabaseInfo databases = 1;
  repeated Tombstone dropped = 2;
}
// Closes and removes the database; `default` cannot be dropped. Streams
// on it end with UNAVAILABLE. NOT_FOUND when there is no such database.
message DropDatabaseRequest { string name = 1; }
message DropDatabaseResponse {}

// A backup written by the daemon as the bare file name `archive` under its
// backup directory (`--backup-dir`; refused without one): full without
// `since`, incremental from `since` with it.
message BackupRequest {
  string archive = 1;
  optional uint64 since = 2;
}

message BackupMeta {
  bool incremental = 1;
  optional uint64 base_head = 2;
  uint64 head = 3;
  uint64 floor = 4;
  int64 created_at_unix_nanos = 5;
  uint64 files = 6;
  uint64 bytes = 7;
  uint32 format = 8;
  optional bytes db_id = 9;
}

// Applies the incremental backup named `archive` under the daemon's backup
// directory.
message ApplyBackupRequest { string archive = 1; }

// A replica pulls whole transactions from `from_position` on.
// `last_fingerprint` is the crc32 of the frame at `from_position - 1` as
// the replica holds it; absent when it has none. A mismatch means the two
// histories diverged.
message ReplicateRequest {
  uint64 from_position = 1;
  optional uint32 last_fingerprint = 2;
}

// Positions [from, to) as back-to-back frames exactly as the leader's
// segments hold them; `to` ends a transaction. `head` and `epoch` are the
// leader's when the chunk was cut. Never ends on its own.
message ReplicationChunk {
  bytes db_id = 1;
  uint64 from = 2;
  uint64 to = 3;
  bytes frames = 4;
  // The leader's head when it took `epoch`: a follower adopts `epoch`
  // once its own head reaches it, so a node at an epoch holds everything
  // that epoch's leader held at its election. 0 from a leader that was
  // not elected in this process.
  uint64 epoch_base = 7;
  uint64 head = 5;
  uint64 epoch = 6;
  // The highest position a majority durably held when the chunk was
  // cut: the follower's confirmed bound.
  uint64 confirmed = 8;
  // Cursors that changed since the previous chunk (every cursor on the
  // opening chunk); a follower stores them after applying the events.
  repeated CursorState cursors = 9;
  // `cursors` is the complete list (the opening chunk): a follower drops
  // every cursor it holds that is not in it.
  bool all_cursors = 10;
}

message PromoteRequest {}
message PromoteResponse {
  uint64 epoch = 1;
  uint64 head = 2;
}

// Tells a leader that a newer epoch exists; it refuses writes from then on.
message FenceRequest { uint64 epoch = 1; }
message FenceResponse { uint64 epoch = 1; }

message RetainRequest { uint64 floor = 1; }
message RetainResponse {
  uint64 floor = 1;
  uint64 segments_removed = 2;
  uint64 bytes_freed = 3;
}

// Every database of one daemon over one service. A call names its
// database with the metadata `chron-db: <name>` (`[a-z0-9_-]{1,64}`);
// absent, it goes to the database `default`, which always exists. An
// unknown name is NOT_FOUND, a bad one INVALID_ARGUMENT. ListDatabases,
// Promote and Fence are daemon-wide and ignore the header.
//
// Status codes: an append whose expectation fails is FAILED_PRECONDITION
// with the metadata `chron-actual-length` and `chron-aggregate`; a
// malformed request is INVALID_ARGUMENT; a position past the head or below
// the floor is OUT_OF_RANGE; a locked directory, a wrong backup base head
// or an existing restore target is FAILED_PRECONDITION; damage and I/O
// failures are INTERNAL. A write refused because of the node's role or
// epoch is FAILED_PRECONDITION with the metadata `chron-epoch`. A missing
// or wrong bearer token is UNAUTHENTICATED; an administrative call
// (Promote, Fence, Retain, Backup, ApplyBackup, Replicate, Follow,
// FetchBackup, Fingerprints, ChangeMembers, the database calls and the
// daemon-to-daemon Heartbeat and RequestVote) without the admin token,
// when the daemon has one, is PERMISSION_DENIED. A
// replication stream meets a transaction larger than the message limit
// with RESOURCE_EXHAUSTED. Subscribe and Replicate end with UNAVAILABLE
// when the daemon is fenced or stops.
service Chron {
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc ReadAggregate(ReadAggregateRequest) returns (stream Event);
  rpc ReadAll(ReadAllRequest) returns (stream Event);
  rpc ReadTag(ReadTagRequest) returns (stream Event);
  rpc AggregateLen(AggregateLenRequest) returns (AggregateLenResponse);
  rpc Head(HeadRequest) returns (HeadResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc Ack(AckRequest) returns (AckResponse);
  rpc ListCursors(ListCursorsRequest) returns (ListCursorsResponse);
  rpc DeleteCursor(DeleteCursorRequest) returns (DeleteCursorResponse);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Backup(BackupRequest) returns (BackupMeta);
  rpc ApplyBackup(ApplyBackupRequest) returns (BackupMeta);
  rpc Retain(RetainRequest) returns (RetainResponse);
  rpc Replicate(ReplicateRequest) returns (stream ReplicationChunk);
  rpc Promote(PromoteRequest) returns (PromoteResponse);
  rpc Fence(FenceRequest) returns (FenceResponse);
  rpc GetMembers(GetMembersRequest) returns (GetMembersResponse);
  rpc ChangeMembers(ChangeMembersRequest) returns (ChangeMembersResponse);
  rpc CreateDatabase(CreateDatabaseRequest) returns (CreateDatabaseResponse);
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  rpc DropDatabase(DropDatabaseRequest) returns (DropDatabaseResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  rpc Fingerprints(FingerprintsRequest) returns (FingerprintsResponse);
  // Replicate with acknowledgments: the follower opens with `open`, the
  // leader streams chunks as Replicate does, and the follower reports
  // each applied head so the leader can confirm sync commits. An admin
  // call; UNIMPLEMENTED on a daemon before 0.4.0.
  rpc Follow(stream FollowRequest) returns (stream ReplicationChunk);
  rpc FetchBackup(FetchBackupRequest) returns (stream BackupChunk);
}
