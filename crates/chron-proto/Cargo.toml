[package]
name = "chron-proto"
description = "chron: the gRPC contract (chron.v1) and generated client and server code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/chron-proto"
keywords = ["event-sourcing", "grpc", "tonic", "protobuf"]
categories = ["network-programming", "database"]

[package.metadata.docs.rs]
all-features = true

[features]
# Conversions between the wire types and the chron library's types.
convert = ["dep:chron", "dep:bytes"]

[dependencies]
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
chron = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
