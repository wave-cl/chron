name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No protoc here on purpose: the generated gRPC code is committed,
      # and this job proves nothing in the workspace needs the compiler.
      # cargo resolves rust-toolchain.toml (1.98.0, clippy, rustfmt) itself;
      # the version is printed so a green run shows what it checked with.
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - run: cargo fmt --all --check
      # The library on its own: a workspace build unifies the daemon's
      # `chron/tokio` onto it, so only a package-scoped build proves the
      # feature-less library compiles.
      - run: cargo clippy -p chron-db --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --workspace --all-features --no-fail-fast

      # Every push proves the five crates package: readme paths, versions
      # on path dependencies, stripped dev-dependencies.
      - run: cargo package --workspace --locked
      - name: the proto crate ships the .proto and the generated code
        run: |
          cargo package --list -p chron-proto | tee /tmp/proto-files
          grep -q '^proto/chron/v1/chron.proto$' /tmp/proto-files
          grep -q '^src/generated/chron.v1.rs$' /tmp/proto-files

  # The committed generated code must match the .proto.
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: CHRON_PROTO_REGEN=1 cargo build -p chron-proto
      - run: git diff --exit-code -- crates/chron-proto/src/generated

  # Numbers, not a gate: the library benches in quick mode and a short
  # fsync-on load against one release daemon, summarised on the run. It
  # fails only when its own build fails, when the load ran without fsync
  # or found a violation, or when the leader paid half an fsync or more
  # per transaction (group commit not batching).
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - run: cargo bench -p chron-db --bench chron -- --quick --noplot 2>&1 | tee bench.txt
      - run: scripts/e2e-load.sh --nodes 1 --writers 8 --in-flight 4 --secs 15 --json-out load.json --metrics-out metrics.txt | tee load.txt
      - run: scripts/bench-summary.sh load.json metrics.txt bench.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            bench.txt
            load.txt
            load.json
            metrics.txt
            target/criterion
